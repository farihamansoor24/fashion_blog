<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Stories | LUXEVIBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">

<!-- Header Navigation -->
<header class="bg-white/80 backdrop-blur-md sticky top-0 border-b border-slate-100 z-50 py-3.5 px-6" id="mainHeader">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    
    <!-- 1. Left: Brand Logo -->
    <a href="index.html" id="headerLogo" class="font-serif text-2xl font-bold tracking-tight">
      LUXEVIBE<span class="text-amber-600">.</span>
    </a>

    <!-- 2. Center: Navigation Menu Links -->

    <nav id="navLinks" class="hidden md:flex items-center gap-8 text-xs font-bold uppercase tracking-widest text-slate-600">
  <a href="index.html" class="nav-item hover:text-black transition-colors">Home</a>
  <a href="create-post.html" class="nav-item hover:text-black transition-colors flex items-center gap-1.5">
    <i class="fa-solid fa-pen-nib text-slate-400"></i> Create Blog
  </a>
  <a href="profile.html" class="nav-item hover:text-black transition-colors">Edit Profile</a>
   <a href="saved.html" class="nav-item hover:text-black transition-colors">Bookmarks</a>
</nav>

    <!-- 3. Right Side: Auth Action Buttons & Logged-In User Badge -->
    <div class="flex items-center gap-4" id="navRightSection">
      
      <!-- Guest State (Logged Out) Buttons -->
      <div id="navAuthBtns" class="flex items-center gap-3">
        <a href="auth.html" class="text-xs uppercase font-bold tracking-widest text-slate-600 hover:text-black transition">Log In</a>
        <a href="auth.html?mode=signup" class="px-4 py-2 bg-black text-white text-xs font-bold uppercase tracking-widest rounded-full hover:bg-amber-600 transition">Sign Up</a>
      </div>

      <!-- Logged-In User Profile & Logout Area -->
      <div id="navUserMenu" class="hidden items-center gap-3">
        
        <!-- User Badge Container -->
        <a href="profile.html" title="View & Edit Profile" class="flex items-center gap-2.5 bg-slate-100/80 hover:bg-slate-200/70 px-3.5 py-1.5 rounded-full border border-slate-200/60 transition-all duration-300" id="userBadge">
          <!-- Dynamic Avatar -->
          <div id="userAvatar" class="w-7 h-7 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-white text-[11px] font-bold shadow-xs">
          </div>
          <!-- Username -->
          <span id="userName" class="text-xs font-semibold tracking-wide text-slate-800 capitalize">
          </span>
        </a>

        <!-- Vertical Divider -->
        <span class="w-[1px] h-4 bg-slate-300 my-auto"></span>

        <!-- Logout Button -->
        <button id="logoutBtn" class="text-xs font-bold uppercase tracking-wider text-rose-500 hover:text-rose-700 transition duration-200 px-1">
          Logout
        </button>
      </div>

    </div>

  </div>
</header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="flex justify-between items-end mb-8 border-b border-slate-200 pb-4">
      <div>
        <h1 class="font-serif text-3xl font-bold">Saved Reading List</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Articles bookmarked for later</p>
      </div>
      <button id="clearAllBtn" class="text-xs text-rose-500 hover:underline uppercase font-bold tracking-widest hidden">Clear All</button>
    </div>

    <!-- Status Messages -->
    <div id="loadingState" class="text-center py-12 text-sm text-slate-400">Loading saved stories...</div>
    <div id="emptyState" class="text-center py-16 hidden">
      <p class="text-slate-400 text-sm mb-4">You haven't saved any stories yet.</p>
      <a href="index.html" class="inline-block px-6 py-2.5 bg-black text-white text-xs uppercase font-bold tracking-widest rounded hover:bg-amber-600 transition">Explore Feed</a>
    </div>

    <!-- Saved Posts Grid -->
    <div id="savedContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="module" src="./js/menu-animation.js"></script>
  <script type="module" src="js/saved.js"></script>
  
</body>
</html>

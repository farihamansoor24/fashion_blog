<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | LUXEVIBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#faf9f6] text-slate-900 min-h-screen flex flex-col justify-between antialiased">

  <!-- Header Navigation -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 border-b border-slate-100 z-50 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-serif text-2xl font-bold tracking-tight">LUXEVIBE<span class="text-amber-600">.</span></a>
      <a href="index.html" class="text-xs uppercase font-bold tracking-widest text-slate-400 hover:text-black transition duration-300">&larr; Return to Home</a>
    </div>
  </header>

  <!-- Main Profile Card Container -->
  <main class="max-w-xl mx-auto px-6 py-12 w-full flex-grow flex items-center justify-center">
    <div id="profileCard" class="w-full bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100">
      
      <!-- Title & Header -->
      <div class="text-center mb-8">
        <!-- Dynamic Initial Avatar -->
        <div id="profileAvatar" class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-white text-2xl font-bold shadow-md">
          <i class="fa-solid fa-user"></i>
        </div>
        <h1 class="font-serif text-2xl font-bold tracking-tight">Edit Profile</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Update your account details</p>
      </div>

      <!-- Edit Profile Form -->
      <form id="profileForm" class="space-y-5">
        
        <div>
          <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Username</label>
          <input type="text" id="profUsername" required placeholder="Enter username" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/10 transition duration-300">
        </div>

        <div>
          <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Email Address (Read Only)</label>
          <input type="email" id="profEmail" disabled class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-100 text-slate-500 text-sm cursor-not-allowed">
        </div>

        <div>
          <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Contact Number</label>
          <input type="tel" id="profContact" required placeholder="+1 234 567 890" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/10 transition duration-300">
        </div>

        <div>
          <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Country</label>
          <input type="text" id="profCountry" required placeholder="Your Country" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/10 transition duration-300">
        </div>

        <!-- Alert Notification -->
        <p id="profAlert" class="text-xs p-3.5 rounded-xl border hidden font-medium"></p>

        <!-- Action Buttons -->
        <div class="pt-4 flex gap-3">
          <a href="index.html" class="w-1/3 py-3.5 text-center border border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-widest rounded-full hover:bg-slate-50 transition">
            Cancel
          </a>
          <button type="submit" id="saveProfBtn" class="w-2/3 py-3.5 bg-black text-white text-xs font-bold uppercase tracking-widest rounded-full hover:bg-amber-600 transition-all duration-300 shadow-lg hover:shadow-amber-600/20 active:scale-[0.99]">
            Save Changes
          </button>
        </div>

      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 uppercase tracking-widest">
    &copy; 2026 LUXEVIBE Studio. All Rights Reserved.
  </footer>

  <script type="module" src="./js/profile.js"></script>

  <script>
    // GSAP Entrance Animation
    gsap.from("#profileCard", { opacity: 0, y: 25, duration: 0.8, ease: "power3.out" });
  </script>
</body>
</html>

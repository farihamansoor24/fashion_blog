<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Reader | LUXEVIBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#faf9f6] text-slate-900 antialiased">

  <!-- Simple Article Header -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 border-b z-50 py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-black transition">&larr; Back to Feed</a>
      <a href="index.html" class="font-serif text-2xl font-bold">LUXEVIBE</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-12">
    <!-- Main Article Body -->
    <article id="articleBody" class="bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-slate-100 opacity-0 translate-y-4">
      <p class="text-slate-400 text-center">Loading article...</p>
    </article>

    <!-- Comments Section -->
    <div class="mt-12 bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-slate-100">
      <h3 class="font-serif text-2xl font-bold mb-6">Reader Responses</h3>
      <form id="commentForm" class="mb-8 space-y-4">
        <textarea id="commentText" rows="3" placeholder="Leave a response..." required class="w-full p-4 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-amber-600 transition resize-none"></textarea>
        <button type="submit" class="bg-black text-white text-xs font-bold uppercase tracking-widest px-8 py-3 rounded-full hover:bg-amber-600 transition duration-300">Post Comment</button>
      </form>
      <div id="commentsList" class="space-y-4"></div>
    </div>
  </main>

  <script type="module" src="./js/article.js"></script>
  <script>
    gsap.to("#articleBody", { opacity: 1, y: 0, duration: 0.8, delay: 0.2 });
  </script>
</body>
</html>

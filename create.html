<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Story | LUXEVIBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-950 text-slate-900 min-h-screen flex flex-col justify-between antialiased overflow-x-hidden relative">

  <!-- Full-Page Fashion Background -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div id="bgImage" class="absolute inset-0 bg-cover bg-center bg-no-repeat scale-105 transition-transform duration-1000 opacity-80" style="background-image: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1800');"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-slate-950/40 to-black/60 backdrop-blur-[2px]"></div>
  </div>

  <!-- Header Navigation -->
  <header class="bg-white/85 backdrop-blur-md sticky top-0 border-b border-slate-100 z-50 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-serif text-2xl font-extrabold tracking-tight text-slate-900">LUXEVIBE<span class="text-amber-600">.</span></a>
      <a href="index.html" class="text-xs uppercase font-bold tracking-widest text-slate-500 hover:text-black transition duration-300">&larr; Return to Journal</a>
    </div>
  </header>

  <!-- Main Container: Centered Single Form Card -->
  <main class="max-w-3xl mx-auto px-4 py-10 sm:py-16 w-full flex-grow flex items-center justify-center relative z-10">
    
    <div id="createCard" class="w-full bg-white/90 backdrop-blur-xl p-8 sm:p-14 rounded-3xl shadow-2xl border border-white/40 opacity-0 transform translate-y-8">
      
      <!-- Card Top Header -->
      <div class="text-center mb-10 pb-6 border-b border-slate-200/80">
        <span class="inline-block px-4 py-1.5 bg-amber-50 text-amber-700 text-[10px] uppercase font-bold tracking-widest rounded-full border border-amber-200/50 mb-3">
          Editorial Studio
        </span>
        <h1 id="pageHeading" class="font-serif text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">Create New Story<span class="text-amber-600">.</span></h1>
        <p class="text-xs text-slate-400 mt-2 uppercase tracking-widest font-semibold">Share your luxury fashion perspective</p>
      </div>

      <!-- Story Editor Form -->
      <form id="editorForm" class="space-y-6">
        <input type="hidden" id="editPostId">

        <!-- Title Input -->
        <div class="form-group">
          <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Article Headline</label>
          <input type="text" id="postTitle" required placeholder="Enter editorial headline..." class="w-full px-5 py-4 rounded-2xl border border-slate-200 bg-white/80 text-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/10 transition duration-300">
        </div>

       <!-- Cover Image Upload & Preview Field -->
<div class="form-group">
  <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Cover Image File</label>
  
  <div class="relative flex flex-col items-center justify-center w-full">
    
    <!-- Upload Dropzone (Jab Image Na Ho) -->
    <label id="uploadDropzone" class="relative flex flex-col items-center justify-center w-full min-h-[160px] border-2 border-slate-200 border-dashed rounded-2xl cursor-pointer bg-slate-50/60 hover:bg-slate-50 hover:border-amber-600 transition duration-300 overflow-hidden">
      
      <div id="uploadDefaultState" class="flex flex-col items-center justify-center p-6 text-center">
        <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
        <p class="text-xs text-slate-500 font-medium"><span class="font-bold text-slate-700">Click to upload</span> or drag and drop</p>
        <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-wider">PNG, JPG, or WEBP (MAX 5MB)</p>
      </div>

      <input type="file" id="postImageFile" accept="image/*" class="hidden" />
    </label>

    <!-- Preview Container (Image + Niche Action Buttons) -->
    <div id="previewContainer" class="w-full hidden space-y-3">
      <!-- Image Display -->
      <div class="w-full h-60 rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
        <img id="imagePreview" src="" alt="Cover Preview" class="w-full h-full object-cover">
      </div>

      <!-- Image Ke Niche Buttons -->
      <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
        <button type="button" id="changeImgBtn" class="text-xs font-bold text-amber-700 hover:text-black transition flex items-center gap-2">
          <i class="fa-solid fa-arrows-rotate"></i> Change / Upload Different Image
        </button>

        <button type="button" id="removeImgBtn" class="text-xs font-bold text-rose-600 hover:text-rose-800 transition flex items-center gap-1.5">
          <i class="fa-solid fa-trash-can"></i> Remove
        </button>
      </div>
    </div>

  </div>

  <!-- File Status Tag -->
  <p id="fileName" class="text-xs text-emerald-600 mt-2 font-semibold hidden flex items-center gap-1.5">
    <i class="fa-solid fa-circle-check"></i> <span id="fileNameText">Image loaded successfully</span>
  </p>
</div>

        <!-- Body Content Input -->
        <div class="form-group">
          <label class="block text-xs uppercase font-bold tracking-widest text-slate-500 mb-2">Article Story Body</label>
          <textarea id="postContent" rows="7" required placeholder="Write your fashion story or review..." class="w-full px-5 py-4 rounded-2xl border border-slate-200 bg-white/80 text-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/10 transition duration-300 resize-none"></textarea>
        </div>

        <!-- Action Buttons with Publish Spinner -->
        <div class="flex items-center gap-4 pt-2">
          <a href="index.html" class="w-1/3 py-4 text-center border border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-widest rounded-full hover:bg-slate-50 transition duration-300">
            Cancel
          </a>
          <button type="submit" id="submitBtn" class="w-2/3 py-4 bg-black text-white text-xs font-bold uppercase tracking-widest rounded-full hover:bg-amber-600 transition-all duration-300 shadow-lg hover:shadow-amber-600/20 active:scale-[0.99] flex items-center justify-center gap-2">
            <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden text-amber-400 text-sm"></i>
            <span id="btnText">Publish Story</span>
          </button>
        </div>
      </form>

      <div class="mt-8 text-center text-xs text-slate-400 font-light border-t border-slate-200/80 pt-6">
        Your article will be published across the global LUXEVIBE feed.
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-950/70 backdrop-blur-md border-t border-white/10 py-6 text-center text-xs text-slate-400 uppercase tracking-widest relative z-10">
    &copy; 2026 LUXEVIBE Studio. All Rights Reserved.
  </footer>

  <script type="module" src="./js/editor.js"></script>

  <!-- GSAP Animations & UI Handlers -->
  <script>
    // Smooth GSAP Entrance
    gsap.to("#createCard", { 
      opacity: 1, 
      y: 0, 
      duration: 1, 
      ease: "power4.out",
      delay: 0.1 
    });

    gsap.from(".form-group", { 
      opacity: 0, 
      y: 15, 
      duration: 0.6, 
      stagger: 0.12, 
      delay: 0.4,
      ease: "power2.out" 
    });

    const fileInput = document.getElementById('postImageFile');
const uploadDropzone = document.getElementById('uploadDropzone');
const previewContainer = document.getElementById('previewContainer');
const imagePreview = document.getElementById('imagePreview');
const changeImgBtn = document.getElementById('changeImgBtn');
const removeImgBtn = document.getElementById('removeImgBtn');
const fileName = document.getElementById('fileName');
const fileNameText = document.getElementById('fileNameText');

// Change Image button click hone par file dialog kholein
changeImgBtn?.addEventListener('click', () => {
  fileInput.click();
});

// File select hone par preview dikhayein
fileInput?.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      imagePreview.src = event.target.result;
      uploadDropzone.classList.add('hidden');
      previewContainer.classList.remove('hidden');

      if (fileNameText && fileName) {
        fileNameText.textContent = `Selected: ${file.name}`;
        fileName.classList.remove('hidden');
      }
    };
    reader.readAsDataURL(file);
  }
});

// Image Remove karna
removeImgBtn?.addEventListener('click', () => {
  fileInput.value = '';
  imagePreview.src = '';
  previewContainer.classList.add('hidden');
  uploadDropzone.classList.remove('hidden');
  fileName?.classList.add('hidden');
});
  </script>
</body>
</html>
